<!-- myapp/templates/base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Aplicación{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{% url 'crear_actividad' %}">Crear actividad</a></li>
                <li><a href="{% url 'resumen' %}">Reporte</a></li>
            </ul>
        </nav>
    </header>
    <main>
        {% block content %}
        <!-- Este contenido será reemplazado por las plantillas que extiendan base.html -->
        {% endblock %}
    </main>
</body>
</html>
